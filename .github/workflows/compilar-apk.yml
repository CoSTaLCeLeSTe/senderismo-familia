name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      # Deja el log (y la APK si existe) en la rama "build" para poder revisar cada compilación.
      - name: Publicar resultado en la rama build
        if: always()
        run: |
          mkdir -p out
          cp build.log out/build.log 2>/dev/null || echo "sin log" > out/build.log
          cp app/build/outputs/apk/debug/app-debug.apk out/senderismo-familia.apk 2>/dev/null || true
          echo "commit=${GITHUB_SHA} estado=${{ job.status }} version=${GITHUB_RUN_NUMBER}" > out/STATUS
          cd out
          git init -q -b build
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Compilación ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build

      # Versión descargable desde la página de Releases del repositorio.
      - name: Publicar versión descargable
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima out/senderismo-familia.apk \
            --title "Senderismo Familia (última versión)" \
            --notes "Versión 0.1.${GITHUB_RUN_NUMBER}. Descarga senderismo-familia.apk desde el móvil e instálala."
